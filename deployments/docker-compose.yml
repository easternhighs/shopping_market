# 本文件用来一键启动项目依赖的三个环境：MySQL、Redis、Kafka。
# 把它们想象成三个独立的小程序，docker compose 会帮我们同时启动。

services:
  mysql:
    image: mysql:8.0
    container_name: shopping_market_mysql
    restart: unless-stopped
    environment:
      # 数据库 root 用户的密码，开发环境随意设置即可。
      MYSQL_ROOT_PASSWORD: root
      # 启动时自动创建的数据库名字。
      MYSQL_DATABASE: shopping_market
    # 提高 MySQL 允许的最大连接数。默认值是 151，高并发压测时连接会被打满，
    # 之后出现 “dial tcp 127.0.0.1:3307: refused”。
    command: ["--max_connections=500"]
    ports:
      # 把容器里的 3306 端口映射到本机 3307，之后 Go 程序连 localhost:3307。
      # 使用 3307 是为了避免和本机已有的 3306 服务冲突。
      - "3307:3306"
    volumes:
      # 把数据存到 Docker 卷里，容器重启后数据不丢。
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopping_market_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: shopping_market_kafka
    restart: unless-stopped
    ports:
      # 9092 是 Kafka 对外提供服务的端口。
      - "9092:9092"
    environment:
      # 下面这些配置让单个 Kafka 节点同时扮演 controller 和 broker，
      # 使用 KRaft 模式，不需要额外的 ZooKeeper，方便本地开发。
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 自动创建 topic 时的默认分区数。
      # 分区是“并行消费的上限”：1 个分区同一时刻只能有 1 个消费者在处理，
      # 所以想让消费端 6 个 goroutine 都干活，分区数就不能少于 6。
      # 注意：这个配置只对“新建的” topic 生效；seckill_orders 已经建好了，
      # 要给老 topic 加分区请执行 `make kafka-partitions`。
      KAFKA_NUM_PARTITIONS: "6"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  kafka_data:
