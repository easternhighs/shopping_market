# 本文件用来一键启动项目依赖的三个环境：MySQL、Redis、Kafka。
# 把它们想象成三个独立的小程序，docker compose 会帮我们同时启动。

services:
  mysql:
    image: mysql:8.0
    container_name: shopping_market_mysql
    restart: unless-stopped
    environment:
      # 数据库 root 用户的密码，开发环境随意设置即可。
      MYSQL_ROOT_PASSWORD: root
      # 启动时自动创建的数据库名字。
      MYSQL_DATABASE: shopping_market
    ports:
      # 把容器里的 3306 端口映射到本机 3306，之后 Go 程序连 localhost:3306。
      - "3306:3306"
    volumes:
      # 把数据存到 Docker 卷里，容器重启后数据不丢。
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopping_market_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    container_name: shopping_market_kafka
    restart: unless-stopped
    ports:
      # 9092 是 Kafka 对外提供服务的端口。
      - "9092:9092"
    environment:
      # 下面这些配置让单个 Kafka 节点同时扮演 controller 和 broker，
      # 使用 KRaft 模式，不需要额外的 ZooKeeper，方便本地开发。
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  kafka_data:
